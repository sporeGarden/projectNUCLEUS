[package]
name = "tunnel-keeper"
version = "0.2.0"
edition.workspace = true
license.workspace = true
description = "Tunnel Keeper — Pure Rust tunnel manager. YAML via serde-saphyr, crypto via ChaCha20/Ed25519, transport evolution: CF→Songbird→BearDog"

[[bin]]
name = "tunnelKeeper"
path = "src/main.rs"

[features]
default = []
songbird-transport = []
access-apps = []

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "0.0.26"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "webpki-roots", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
chacha20poly1305 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
thiserror = "2"
nucleus-primals = { path = "../../deploy/nucleus-primals" }

[lints]
workspace = true
