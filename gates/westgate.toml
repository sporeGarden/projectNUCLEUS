[gate]
name = "westgate"
role = "Data NAS — sovereign scientific data root"
location = "Sovereign cluster — LAN"
bonding = "covalent"
secure_by_default = true

[hardware]
cpu = "AMD Ryzen 7 5700X"
cores = 8
threads = 16
gpu_display = "NVIDIA GeForce RTX 3070"
gpu_arch = "Ampere GA104"
gpu_vram_gb = 8
ram_gb = 64
ram_type = "DDR4"
storage_pool_tb = 63.7
storage_pool_layout = "raidz1 (5× OOS14000G 14 TB)"
storage_pool_used_tb = 3.21
storage_pool_free_tb = 47.5
storage_cache = "CT2000BX500SSD1 (2 TB SSD, ZFS L2ARC)"
storage_boot = "NVMe 1.8 TB (Pop!_OS root)"
zfs_pool_name = "nestgate"
zfs_health = "ONLINE, 0 errors"
os = "Pop!_OS 22.04 LTS"

[network]
lan_speed = "1G"
wan_speed = "1G fiber"
interface = "enp4s0 (1G, UP)"

[membrane]
role = "intracellular"
bonding_to_vps = "covalent (SSH key)"
socket_dir = "/run/user/1000/membrane"
socket_count = 25

[composition]
atomic = "nest_atomic + full_tower"
primals = [
    "beardog", "songbird",
    "nestgate",
    "rhizocrypt", "loamspine", "sweetgrass",
    "barracuda", "coralreef", "toadstool",
    "squirrel", "petaltongue",
]
fragment = "Full tower with provenance trio + compute + render + agent dispatch"

[composition.services]
nestgate = { socket = "nestgate-westgate-tower-155f.sock", role = "CAS content-addressed storage" }
rhizocrypt = { socket = "rhizocrypt-westgate-tower-155f.sock", role = "Ephemeral DAG (provenance trio)" }
loamspine = { socket = "loamspine-westgate-tower-155f.sock", role = "Permanent ledger (provenance trio)" }
sweetgrass = { socket = "sweetgrass-westgate-tower-155f.sock", role = "Attribution braids (provenance trio)" }
