barracuda = { socket = "barracuda-westgate-tower-155f.sock", role = "GPU math primitives" }
coralreef = { socket = "coralreef-westgate-tower-155f.sock", role = "Shader compilation" }
toadstool = { socket = "toadstool-westgate-tower-155f.sock", role = "Compute dispatch" }
squirrel = { socket = "squirrel-westgate-tower-155f.sock", role = "Agent dispatch (G18)" }
petaltongue = { socket = "petaltongue-westgate-tower-155f.sock", role = "Visualization / UI render" }
