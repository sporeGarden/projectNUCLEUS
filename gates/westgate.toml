neural_api = { socket = "neural-api-westgate-tower-155f.sock", role = "biomeOS capability routing", version = "4.57.0" }
btsp = { socket = "btsp-westgate-tower-155f.sock", role = "Trust protocol" }

[identity]
family_name = "irongate-sovereign"
family_id = "9b32f3a8"
node_id = "westgate"
