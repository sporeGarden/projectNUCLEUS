[package]
name = "nucleus-deploy"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Deploy, validate, and prove provenance for NUCLEUS gate compositions"

[[bin]]
name = "nucleus-deploy"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "process", "fs"] }
toml = "0.8"
nucleus-primals = { path = "../nucleus-primals" }
blake3 = "1.8.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
hickory-resolver = { version = "0.25", default-features = false, features = ["tokio"] }

[lints]
workspace = true
